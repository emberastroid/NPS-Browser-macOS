name: macOS Build Pipeline & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-project:
    runs-on: macos-latest

    steps:
    # 1. Pull the repository code onto the runner
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Ensure Carthage is available
    - name: Install Carthage
      run: brew install carthage

    # 3. Cache Step: Check for an existing pre-built Carthage/Build folder
    - name: Cache Carthage Dependencies
      id: carthage-cache
      uses: actions/cache@v4
      with:
        path: Carthage/Build
        # Creates a unique key signature based on your dependency tracking file
        key: ${{ runner.os }}-carthage-${{ hashFiles('**/Cartfile.resolved', '**/Cartfile') }}
        restore-keys: |
          ${{ runner.os }}-carthage-

    # Step 1 — Only runs if cache misses: Check out dependencies
    - name: Carthage Bootstrap (Expected to Fail)
      if: steps.carthage-cache.outputs.cache-hit != 'true'
      run: |
        carthage bootstrap --platform macOS --no-use-binaries --cache-builds || true

    # Step 2 — Only runs if cache misses: Patch old deployment targets
    - name: Patch Deployment Targets
      if: steps.carthage-cache.outputs.cache-hit != 'true'
      run: |
        find Carthage/Checkouts -name "project.pbxproj" | while read f; do
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 12.0/g' "$f"
          sed -i '' 's/MACOSX_DEPLOYMENT_TARGET = 10\.[0-9]*/MACOSX_DEPLOYMENT_TARGET = 10.13/g' "$f"
        done

    # Step 3 — Only runs if cache misses: Build base dependencies
    - name: Carthage Build Base Dependencies
      if: steps.carthage-cache.outputs.cache-hit != 'true'
      run: carthage build --platform macOS --no-use-binaries

    # Step 4 — Only runs if cache misses: Fix iOS-only slices via macOS SDK
    - name: Build Frameworks Directly via macOS SDK
      if: steps.carthage-cache.outputs.cache-hit != 'true'
      run: |
        cd Carthage/Checkouts

        xcodebuild -project Fuzi/Fuzi.xcodeproj \
          -scheme Fuzi -configuration Release -sdk macosx \
          ONLY_ACTIVE_ARCH=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build

        xcodebuild -project promises/Promises.xcodeproj \
          -scheme Promises -configuration Release -sdk macosx \
          ONLY_ACTIVE_ARCH=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build

        xcodebuild -project promises/Promises.xcodeproj \
          -scheme FBLPromises -configuration Release -sdk macosx \
          ONLY_ACTIVE_ARCH=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build

        xcodebuild -project SwiftyBeaver/SwiftyBeaver.xcodeproj \
          -scheme SwiftyBeaver-Package -configuration Release -sdk macosx \
          ONLY_ACTIVE_ARCH=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build

        xcodebuild -project SwiftyUserDefaults/SwiftyUserDefaults.xcodeproj \
          -scheme SwiftyUserDefaults -configuration Release -sdk macosx \
          ONLY_ACTIVE_ARCH=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build

        xcodebuild -workspace realm-swift/Carthage/Realm.xcworkspace \
          -scheme RealmSwift -configuration Release -sdk macosx \
          ONLY_ACTIVE_ARCH=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build

        xcodebuild -project Alamofire/Alamofire.xcodeproj \
          -scheme "Alamofire macOS" -configuration Release -sdk macosx \
          ONLY_ACTIVE_ARCH=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build

    # Step 4 continued — Only runs if cache misses: Move frameworks into place
    - name: Copy Frameworks to Carthage Build Directory
      if: steps.carthage-cache.outputs.cache-hit != 'true'
      run: |
        for dep in Fuzi Promises FBLPromises SwiftyBeaver SwiftyUserDefaults RealmSwift Realm Alamofire; do
          src=$(find ~/Library/Developer/Xcode/DerivedData -name "$dep.framework" \
            -path "*/Products/Release/*" ! -path "*ios*" ! -path "*simulator*" 2>/dev/null | head -1)
          if [ -n "$src" ]; then
            echo "Copying $dep"
            rm -rf Carthage/Build/Mac/$dep.framework
            cp -R "$src" Carthage/Build/Mac/
          fi
        done

    # Step 5 — Only runs if cache misses: Copy minizip headers
    - name: Copy Minizip Headers
      if: steps.carthage-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p Carthage/Build/Mac/Zip.framework/Headers/minizip
        cp Carthage/Checkouts/Zip/Zip/minizip/*.h \
           Carthage/Build/Mac/Zip.framework/Headers/minizip/
        cp Carthage/Checkouts/Zip/Zip/minizip/module.modulemap \
           Carthage/Build/Mac/Zip.framework/Headers/minizip/

    # Step 6 — Injects both Framework and Swift Include paths so module emissions succeed
    - name: Compile NPS Browser App
      run: |
        xcodebuild \
          -project "NPS Browser.xcodeproj" \
          -scheme "NPS Browser" \
          -configuration Debug \
          -destination 'platform=macOS,arch=arm64' \
          -sdk macosx \
          ONLY_ACTIVE_ARCH=YES \
          CODE_SIGNING_ALLOWED=NO \
          FRAMEWORK_SEARCH_PATHS="\$(SRCROOT)/Carthage/Build/Mac" \
          SWIFT_INCLUDE_PATHS="\$(SRCROOT)/Carthage/Build/Mac" \
          build

    # Step 7 — Find the built .app, compress it, and upload as an artifact
    - name: Package build output
      run: |
        set -e
        echo "Searching for built .app in DerivedData..."
        APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -type d -name "NPS Browser.app" -print -quit)
        if [ -z "$APP_PATH" ]; then
          echo "No .app found under DerivedData. Listing DerivedData dirs for debugging:"
          ls -la $HOME/Library/Developer/Xcode/DerivedData || true
          echo "Failing the job because the app was not found."
          exit 1
        fi
        echo "Found app: $APP_PATH"
        ZIP_NAME=NPS-Browser-Mac-Build.zip
        rm -f "$ZIP_NAME"
        ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"

    - name: Upload App Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NPS-Browser-Mac-Build
        path: NPS-Browser-Mac-Build.zip
